services:
  - type: web
    name: division-athletic-meet-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: division-athletic-meet-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: cristian.damandaman@deped.gov.ph
      - key: MAIL_FROM
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  - name: division-athletic-meet-db
    databaseName: division_athletic_meet
    user: division_athletic_meet
    plan: free
    region: singapore
