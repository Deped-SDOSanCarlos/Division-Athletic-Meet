<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Staff Sign In | Division Athletic Meet</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 15%,#17436a 0,#0b223b 34%,#061321 75%);color:#f5f8ff;font-family:'DM Sans',Arial,sans-serif}.card{width:min(100%,460px);padding:38px;border:1px solid #ffffff24;border-radius:22px;background:#081728ed;box-shadow:0 24px 80px #0006}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.crest{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#f0c66a,#a87925);color:#102238;font-size:25px}.brand small{display:block;color:#a9c1dc;font-size:11px;letter-spacing:2px;font-weight:700}.brand strong{font-family:'Barlow Condensed';font-size:20px;letter-spacing:1px}h1{font-family:'Barlow Condensed';font-size:38px;line-height:1;margin:0 0 12px}.intro{color:#c4d3e4;line-height:1.6;font-size:14px;margin:0 0 26px}label{display:block;font-size:12px;font-weight:700;color:#d5e1ee;margin:16px 0 8px}input{width:100%;height:48px;padding:0 14px;border:1px solid #36516d;border-radius:10px;background:#0b1c30;color:white;font:inherit;outline:none}input:focus{border-color:#e4b95c;box-shadow:0 0 0 3px #e4b95c26}button{width:100%;height:48px;margin-top:18px;border:0;border-radius:10px;background:linear-gradient(135deg,#f0c66a,#c99538);color:#17263a;font:700 14px 'DM Sans';cursor:pointer}button:disabled{opacity:.6;cursor:wait}.secondary{margin-top:12px;background:transparent;border:1px solid #405b77;color:#dce8f5}.msg{min-height:22px;margin:14px 0 0;color:#9fc5ee;font-size:13px;line-height:1.5}.msg.err{color:#ff9b9b}.hint{font-size:12px;color:#91a9c2;line-height:1.5;margin-top:18px;text-align:center}
</style></head><body><main class="card"><div class="brand"><div class="crest">🏆</div><div><small>OFFICIAL DIVISION EVENT</small><strong>DIVISION ATHLETIC MEET</strong></div></div><h1>STAFF PORTAL</h1><p class="intro">Sign in using the email address and password provided by your Super Administrator.</p><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="username" placeholder="name@deped.gov.ph"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button id="login" type="button">SIGN IN</button><p id="msg" class="msg" role="status" aria-live="polite"></p><p class="hint">Accounts are created and managed by the Super Administrator. Contact the administrator if you need access.</p><button class="secondary" type="button" onclick="location.href='/'">← BACK TO PUBLIC TALLY</button></main>
<script>
const $=id=>document.getElementById(id);
async function signIn(){const email=$("email").value.trim().toLowerCase(),password=$("password").value;if(!email||!password){$("msg").className="msg err";$("msg").textContent="Enter your email address and password.";return}try{$("login").disabled=true;$("msg").className="msg";$("msg").textContent="Signing in…";const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw Error(d.error||"Sign-in failed.");const next=new URLSearchParams(location.search).get("next")||"/";location.replace(next.startsWith("/")&&!next.startsWith("//")?next:"/")}catch(e){$("msg").className="msg err";$("msg").textContent=e.message}finally{$("login").disabled=false}}
$("login").onclick=signIn;$("email").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});$("password").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});fetch("/api/session").then(r=>{if(r.ok)location.replace("/")}).catch(()=>{});
</script></body></html>
